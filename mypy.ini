[mypy]
python_version = 3.13
strict = true
warn_unreachable = true
files = custom_components/casambi_bt

; voluptuous ships no type information
[mypy-voluptuous.*]
ignore_missing_imports = true

; These libraries re-export symbols without declaring __all__
[mypy-homeassistant.*]
implicit_reexport = true

[mypy-CasambiBt.*]
implicit_reexport = true
