# Status of this integration against the Home Assistant integration quality scale.
# See https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: The integration does not register custom service actions.
  appropriate-polling:
    status: done
    comment: |
      No polling at all. The integration is local_push: the casambi-bt library
      maintains a BLE connection and pushes unit state changes via callbacks.
      This is also why no DataUpdateCoordinator is used - the coordinator
      pattern exists to centralize polling, which this integration never does.
      Entities subscribe to per-unit push callbacks instead.
  brands:
    status: done
    comment: |
      Ships the official Casambi brand images locally in the brand/ folder
      (supported since HA 2026.3, which also stopped accepting custom
      integrations in the home-assistant/brands repo).
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No custom actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage:
    status: done
    comment: |
      Config flow, setup/unload, and the cover, light, number, and scene
      platforms are covered by tests run in CI on every push.

  # Gold
  devices: done
  diagnostics: done
  discovery: done
  discovery-update-info:
    status: exempt
    comment: |
      The bluetooth address is the identity of a Casambi network and is used
      as the config entry unique id; a different address is a different
      network, so there is no address to update.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: done
    comment: |
      The network configuration is re-fetched on reconnect; when the unit
      list changed, the config entry reloads itself so entities match.
      Wall switch button entities are additionally discovered dynamically
      at runtime.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: No noisy or rarely used entities are created.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: No repairable situations beyond reauth, which is implemented.
  stale-devices:
    status: done
    comment: |
      When the unit list changes the entry reloads, so stale entities stop
      being provided; async_remove_config_entry_device allows deleting the
      leftover devices from the UI.

  # Platinum
  async-dependency: done
  inject-websession:
    status: done
    comment: The httpx client is injected via homeassistant.helpers.httpx_client.
  strict-typing:
    status: done
    comment: casambi-bt ships py.typed; the integration is fully annotated.
