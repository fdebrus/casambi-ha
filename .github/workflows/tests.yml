name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: pytest (${{ matrix.core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: HA 2026.2.3
            python-version: "3.13"
            requirements: requirements_test.txt
          - core: HA 2026.10.1
            python-version: "3.14"
            requirements: requirements_test_latest.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
      - name: Run tests
        run: pytest tests/ -q

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
      - name: Run mypy
        run: mypy
