<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="0.55" stop-color="#24406e"/>
      <stop offset="1" stop-color="#3a5f9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.62">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffc76b" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc76b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d4e4"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="16" y="16" width="480" height="480" rx="104"/>
    </clipPath>
  </defs>

  <!-- badge background -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#sky)"/>

  <g clip-path="url(#badge)">
    <!-- warm light glow under the roof, inside the posts -->
    <ellipse cx="256" cy="320" rx="138" ry="100" fill="url(#glow)"/>

    <!-- bluetooth-ish signal arcs above the roof -->
    <g stroke="#7fb4ff" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M 238 112 A 44 44 0 0 1 274 112"/>
      <path d="M 216 84 A 78 78 0 0 1 296 84"/>
    </g>
    <circle cx="256" cy="138" r="11" fill="#7fb4ff"/>

    <!-- louvre slats forming the roof -->
    <g transform="translate(0 196)">
      <g fill="url(#slat)">
        <g transform="translate(146 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
        <g transform="translate(190 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
        <g transform="translate(234 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
        <g transform="translate(278 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
        <g transform="translate(322 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
        <g transform="translate(366 0) rotate(-32)"><rect x="-28" y="-8" width="56" height="16" rx="8"/></g>
      </g>
    </g>

    <!-- pergola posts -->
    <g fill="#f7f9fc">
      <rect x="86" y="164" width="30" height="248" rx="14"/>
      <rect x="396" y="164" width="30" height="248" rx="14"/>
    </g>

    <!-- ground line -->
    <rect x="72" y="402" width="368" height="16" rx="8" fill="#0f1a30" opacity="0.65"/>
  </g>
</svg>
